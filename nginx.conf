server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://wa.me; object-src 'none'; upgrade-insecure-requests" always;
  server_tokens off;

  location / {
    try_files $uri $uri/ =404;
  }

  location /assets/ {
    expires 7d;  # sem add_header aqui: senão os cabeçalhos de segurança do server{} deixam de ser herdados
  }

  location ~* \.(png|svg|ico)$ {
    expires 7d;  # sem add_header aqui: senão os cabeçalhos de segurança do server{} deixam de ser herdados
  }
}
